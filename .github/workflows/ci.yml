name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # previous LTS (22), latest LTS (24), latest current release (26)
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The lockfile is generated with npm 11; pin it so `npm ci` interprets
      # the dependency tree the same way and stays in sync.
      - name: Pin npm
        run: npm i -g npm@11

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Neither was enforced anywhere, which is how `src/lib/observable-spy.ts` sat unformatted in
      # the repository. `format:check` covers the scope the `format` script owns (`src/**/*.ts`).
      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # `llms.txt` / `llms-full.txt` are generated from the docs sidebar and committed, so agents can
      # fetch them from the deployed site *and* from raw GitHub. A stale pair is invisible until an
      # agent reads the wrong thing — check it here rather than trusting the docs deploy to notice.
      - name: llms.txt is up to date
        run: npm run llms:check

      # The Claude Code plugin manifests advertise the release the bundled skill describes.
      - name: Plugin manifests match package.json
        run: npm run plugin:sync:check

      - name: Test + coverage
        run: npm run test:coverage

      # One shared environment, one worker — the mode `setupAutoSpy()` exists for. A property patch
      # or a registry left behind by one file surfaces here and nowhere else.
      - name: Test (shared environment, isolate false)
        run: npm run test:shared-env

      - name: Build
        run: npm run build

  # Bun is a second runtime, not a second lane of the same one: `bun:test` mocks behave differently
  # from Vitest's (no `mock.settledResults`, `mockReset` drops the implementation, `spyOn` refuses
  # accessors), and the Angular preload only exists here. None of that is observable from the Node
  # matrix above, which runs the Bun adapter against a stub.
  bun:
    name: Test (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor this package supports, and whatever ships today
        bun: ['1.4.0', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      # Dependencies still come from the npm lockfile — Bun is the runtime under test here, not the
      # package manager, and a second lockfile would be a second dependency tree to keep honest.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm i -g npm@11

      - run: npm ci

      - name: Test (bun:test — core + rxjs, no preload)
        run: npm run test:bun

      - name: Test (bun:test — Angular TestBed)
        run: npm run test:bun:angular

      # Bun 1.4's `--isolate` gives each file a fresh global, the way Vitest behaves by default. The
      # unflagged runs above share one global, so the pair covers both shapes a consumer can pick.
      - name: Test (bun:test — --isolate)
        run: npm run test:bun:isolate

      - name: Build
        run: npm run build

      # The published artifact, not the source: `bun-angular` is ESM-only and is loaded as a
      # preload, which is the one code path a source-only run never exercises.
      - name: Test (built bun-angular entry as preload)
        run: bun test --preload ./dist/bun-angular.js ./src/bun-tests
