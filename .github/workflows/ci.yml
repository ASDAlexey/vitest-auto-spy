name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# Three pushes in a row queue three full matrices, and only the last of them can still be true.
# `master` is the exception: every commit there is what a release gets cut from, so it keeps its own
# verdict — grouping those runs by sha is what stops them from queueing behind each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # previous LTS (22), latest LTS (24), latest current release (26)
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The lockfile is generated with npm 11; pin it so `npm ci` interprets
      # the dependency tree the same way and stays in sync.
      - name: Pin npm
        run: npm i -g npm@11

      - run: npm ci

      - name: Test + coverage
        run: npm run test:coverage

      # One shared environment, one worker — the mode `setupAutoSpy()` exists for. A property patch
      # or a registry left behind by one file surfaces here and nowhere else.
      - name: Test (shared environment, isolate false)
        run: npm run test:shared-env

      # `vitest-auto-spy/zone` is the only entry that touches zone.js, and the runs above deliberately
      # load none of it — so `fakeAsync` / `waitForAsync` are covered here or nowhere.
      - name: Test (fakeAsync under zone.js)
        run: npm run test:zone

      # The DOM stubs are written against jsdom's gaps, and the repairs in `timer-globals.ts`,
      # `clock.ts` and `abort-controller-stub.ts` are written against happy-dom's differences — which
      # were simulated by hand until this project ran the suite on the real thing.
      - name: Test (happy-dom)
        run: npm run test:happy-dom

      # Architecture invariants rather than behaviour: the heap has to reach a plateau across
      # create/teardown cycles, and teardown has to stay linear. Both assert shape, not milliseconds.
      - name: Test (engine invariants)
        run: npm run test:invariants

      # Rstest is the one runner in the gate that bundles the suite before running it, so the
      # source-level registration of the adapter — which no stubbed unit spec can prove — and the
      # `sideEffects` entry that keeps rspack from dropping it are covered here or nowhere.
      - name: Test (rstest runner)
        run: npm run test:rstest

      - name: Build
        run: npm run build

      # The suites above import `src/`; people import `dist/`, cut by tsup into a bundle per entry
      # point, and a bundler decision is invisible to every source-level spec. `explainSpy` shipped
      # dead in 5.0.0 for exactly that reason — `ArgsMap` inlined into three entries at once, so the
      # `instanceof` the report is built on was false across the boundary, with the suite green and
      # coverage at 100 %. This loads each built entry in its own process and runs the cross-entry
      # checks that can see it.
      - name: Smoke the built package
        run: npm run smoke:dist

      # Both read `dist/`, so they can only run after the build. Deterministic counts — bundled
      # bytes and module-graph size — so a shared runner cannot make them flap.
      - name: Per-entry size baseline
        run: npm run size:entries:check

      - name: Module-graph baseline
        run: npm run cold-import:check

  # Nothing below depends on which Node runs it — the same lint, the same formatter, the same
  # generated files, checked against the same lockfile. Running them once per Node major produced
  # three copies of one answer and put ~40 s on the critical path of every matrix job, so they live
  # here instead and finish while the suites are still starting.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The lockfile is generated with npm 11; pin it so `npm ci` interprets
      # the dependency tree the same way and stays in sync.
      - name: Pin npm
        run: npm i -g npm@11

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The public type surface, and the cost of instantiating it. Both are in `npm run check` and
      # neither was here, so a pull request could widen `Spy<T>` or blow the instantiation budget —
      # the thing that decides how fast a consumer's template type-checking runs — with CI green.
      - name: Public API type tests
        run: npm run test:types

      - name: Type-instantiation budget
        run: npm run types:budget

      # The lockfile and the installed tree disagreeing is invisible until a measurement is taken
      # against the wrong versions.
      - name: Dependency drift
        run: npm run deps:check

      # Neither was enforced anywhere, which is how `src/lib/observable-spy.ts` sat unformatted in
      # the repository. `format:check` covers the scope the `format` script owns (`src/**/*.ts`).
      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Copy-paste detector
        run: npm run jscpd

      # `docs.yml` deploys on a push to `master`, so without these two a broken page is caught after
      # the merge, with the deploy already red. `docs:check` parses the frontmatter every landing
      # card hides in; `ru:check` fails on a Russian page that is missing, half-done, or has drifted
      # off the English heading anchors.
      - name: Docs frontmatter
        run: npm run docs:check

      - name: Russian docs are complete
        run: npm run ru:check

      # The bundled Claude Code skill advertises this package's API to an agent; a stale one hands
      # out advice for a release that no longer exists.
      - name: Bundled skill is valid
        run: npm run skill:check

      # The doctor's entry-point table is generated from this package's own `exports` map — a
      # hand-edited or stale copy would make `helper-from-wrong-entry` report the previous release.
      - name: Doctor export map is up to date
        run: npm run export-map:check

      # `llms.txt` / `llms-full.txt` are generated from the docs sidebar and committed, so agents can
      # fetch them from the deployed site *and* from raw GitHub. A stale pair is invisible until an
      # agent reads the wrong thing — check it here rather than trusting the docs deploy to notice.
      - name: llms.txt is up to date
        run: npm run llms:check

      # The Claude Code plugin manifests advertise the release the bundled skill describes.
      - name: Plugin manifests match package.json
        run: npm run plugin:sync:check

      # `alias/` is generated from this package.json and published as a second npm package, so a new
      # subpath that never reached it — or a hand edit that bypassed the generator — ships two
      # packages that disagree about what they export.
      - name: Alias package matches package.json
        run: npm run alias:sync:check

  # Bun is a second runtime, not a second lane of the same one: `bun:test` mocks behave differently
  # from Vitest's (no `mock.settledResults`, `mockReset` drops the implementation, `spyOn` refuses
  # accessors), and the Angular preload only exists here. None of that is observable from the Node
  # matrix above, which runs the Bun adapter against a stub.
  bun:
    name: Test (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor this package supports, and whatever ships today
        bun: ['1.4.0', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      # Dependencies still come from the npm lockfile — Bun is the runtime under test here, not the
      # package manager, and a second lockfile would be a second dependency tree to keep honest.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm i -g npm@11

      - run: npm ci

      - name: Test (bun:test — core + rxjs, no preload)
        run: npm run test:bun

      - name: Test (bun:test — Angular TestBed)
        run: npm run test:bun:angular

      # Bun 1.4's `--isolate` gives each file a fresh global, the way Vitest behaves by default. The
      # unflagged runs above share one global, so the pair covers both shapes a consumer can pick.
      - name: Test (bun:test — --isolate)
        run: npm run test:bun:isolate

      - name: Build
        run: npm run build

      # The published artifact, not the source: `bun-angular` is ESM-only and is loaded as a
      # preload, which is the one code path a source-only run never exercises.
      - name: Test (built bun-angular entry as preload)
        run: bun test --preload ./dist/bun-angular.js ./src/bun-tests

  # The Angular peer range is a claim, and until this job existed nothing checked it: the matrixes
  # above vary Node and Bun and install exactly one Angular. Both ways this package has broken a
  # range in the past are cheap to catch — a value import of a symbol a major does not export fails
  # at *link* time, and a type that moved fails at *check* time — so neither needs a test run.
  #
  # `ɵSIGNAL` (`lib/run-effect.ts`) is the reason the floor is not lower: it is a value import on the
  # eager path of `dist/angular.js`, absent before Angular 18, and a missing named ESM export takes
  # the whole entry down rather than the one helper. `provideZonelessChangeDetection`
  # (`src/bun-angular.ts`) is why the floor is 20 and not 18.
  angular-range:
    name: Angular ${{ matrix.angular }} (link + types)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the declared floor, and every major published since
        angular: ['20', '21', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm i -g npm@11

      - run: npm ci

      - name: Build
        run: npm run build

      # A real install of the real tarball, not a path alias: resolution is half of what is being
      # tested, and `@angular/platform-browser` is only reachable here because this package now
      # declares it.
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install into a scratch consumer
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p consumer && cd consumer
          npm init -y >/dev/null
          npm i --no-audit --no-fund \
            "@angular/core@${{ matrix.angular }}" \
            "@angular/common@${{ matrix.angular }}" \
            "@angular/compiler@${{ matrix.angular }}" \
            "@angular/platform-browser@${{ matrix.angular }}" \
            rxjs vitest typescript @types/node \
            ../vitest-auto-spy-*.tgz

      # The job that would have caught `ɵSIGNAL` on the day it was written.
      #
      # The imports run inside a Vitest test rather than under a bare `node -e`: `angular-http`
      # registers an `afterEach` at module scope, and Vitest throws on a hook declared with no suite
      # in progress — so a plain import fails on an entry that is perfectly linkable.
      - name: Link-check every Angular entry
        working-directory: ${{ runner.temp }}/consumer
        run: |
          cat > link.test.ts <<'TS'
          import { test } from 'vitest';

          test('every Angular entry links', async () => {
            await import('vitest-auto-spy');
            await import('vitest-auto-spy/angular');
            await import('vitest-auto-spy/angular-http');
          });
          TS
          npx vitest run link.test.ts

      # Types move between majors without any runtime symptom — `InputSignalWithTransform` and
      # `ModelSignal` (`lib/render-shallow.ts`) are the ones this package already depends on.
      # `skipLibCheck` stays off so the shipped declarations are checked too, and `@types/node` is
      # installed because `SpyDisposable` keys off the ambient `Symbol.dispose` — a dependency this
      # package does not declare, tracked separately. Without it the job would go red on that rather
      # than on anything Angular, which is not what it is here to say.
      - name: Type-check a consumer against the published declarations
        working-directory: ${{ runner.temp }}/consumer
        run: |
          cat > probe.ts <<'TS'
          import { createSpyFromClass, type Spy } from 'vitest-auto-spy';
          import { provideAutoSpy, renderShallow } from 'vitest-auto-spy/angular';

          class Service {
            load(id: string): Promise<string> {
              return Promise.resolve(id);
            }
          }

          export const spy: Spy<Service> = createSpyFromClass(Service);
          export const providers = [provideAutoSpy(Service)];
          export const render = renderShallow;
          TS
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "target": "es2022",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": false,
              "types": ["node"],
              "experimentalDecorators": true
            },
            "files": ["probe.ts"]
          }
          JSON
          npx tsc -p tsconfig.json
