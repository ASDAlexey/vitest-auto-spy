name: Release

# Creates the GitHub Release for a manually pushed v* tag, e.g. `git push origin v1.2.3`.
#
# This workflow does NOT publish to npm any more. Publishing moved to npm Trusted
# Publishing (OIDC), and a package can have exactly one trusted publisher naming exactly
# one workflow file — that file is `auto-release.yml`, the automatic path from master. A
# second publishing workflow could not authenticate, so this one was reduced to the part
# that never needed npm credentials.
#
# Consequence, on purpose: pushing a tag by hand no longer puts anything on npm. To
# release, land a `feat:`/`fix:`/breaking commit on master and let auto-release.yml bump,
# tag, publish and release. This file only backfills a GitHub Release for a tag that
# auto-release.yml did not create — which is also why it is not skipped by `[skip ci]`
# discussions: tags pushed by GITHUB_TOKEN never trigger workflows, so it only ever runs
# for a tag a human pushed.
#
# Re-running for a tag that already has a Release is a no-op (safe to retry).

on:
  push:
    tags: ['v*']

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so the release notes can link the previous version

      # scripts/release-notes.mjs uses node builtins only — no `npm ci`, no build.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create GitHub Release (skip if it already exists)
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
          else
            # Same notes as the auto-release path — see scripts/release-notes.mjs.
            node scripts/release-notes.mjs "${GITHUB_REF_NAME}" --out "${RUNNER_TEMP}/release-notes.md"
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md" --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
