name: Publish alias

# Publishes the `vitest-auto-spies` alias package (the `alias/` directory).
#
# It is a second npm package, so it needs its own `npm publish` — but nothing about it is a
# judgement call: the directory is generated from the canonical `package.json`
# (`scripts/sync-alias.mjs`, run by the `version` lifecycle script), so by the time a release commit
# exists the alias already carries the right version and the right entry points. Publishing it by
# hand is what let it sit at 1.9.3 for two majors, without `/bun-angular`, `/setup`, `/zone` or
# `/eslint-plugin`.
#
# Called by `auto-release.yml` after the canonical package is on npm (`release.yml` no longer
# publishes at all).
#
# It authenticates with npm Trusted Publishing (OIDC) — no `NPM_TOKEN`. The trusted publisher
# registered on npmjs.com for `vitest-auto-spies` names **auto-release.yml**, not this file: npm
# validates the workflow that *entered* the run, and for a reusable workflow that is the caller.
# Which is why there is no `workflow_dispatch` here — a hand-started run of this file would present
# `publish-alias.yml` as its workflow ref and npm would refuse the token. To republish the alias by
# hand, use Actions → *Auto Release* → *Run workflow* and fill in `alias_ref` (e.g. `v3.9.0`);
# publishing an already-published version is a no-op.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag or branch to publish from. Defaults to the caller's ref.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a publish credential; also carries provenance

# The alias must never be published twice concurrently, and never while the canonical one is mid-flight.
concurrency:
  group: publish-alias
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # No `registry-url` on purpose, exactly as in auto-release.yml: setup-node would write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc, npm would read that as
      # "auth is already configured", skip the OIDC exchange and die with ENEEDAUTH.
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # >= 22.14, the floor for trusted publishing

      # Exact, not `npm@11` — same reasoning as auto-release.yml: trusted publishing needs
      # >= 11.5.1 and a floating major must not be able to drift below that floor.
      - name: Pin npm
        run: npm i -g npm@11.19.1

      # The stubs and the exports map are generated. A hand edit that never went through the
      # generator would publish a package that disagrees with the canonical one — catch it here
      # rather than on someone's `import`.
      - name: Alias is in sync with package.json
        run: node scripts/sync-alias.mjs --check

      - name: Publish to npm (skip if the version already exists)
        working-directory: alias
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if npm view "vitest-auto-spies@${VERSION}" version >/dev/null 2>&1; then
            echo "vitest-auto-spies@${VERSION} is already published — nothing to do."
            exit 0
          fi

          # The alias depends on the canonical package by an exact caret range, so publishing it
          # first would put an uninstallable version on npm.
          CANONICAL="$(node -p "require('./package.json').dependencies['vitest-auto-spy'].replace(/^\^/, '')")"

          if ! npm view "vitest-auto-spy@${CANONICAL}" version >/dev/null 2>&1; then
            echo "::error::vitest-auto-spy@${CANONICAL} is not on npm yet — publish the canonical package first."
            exit 1
          fi

          # No `--provenance`: npm attaches it by itself when trusted publishing puts a public
          # package on npm from a public repo.
          #
          # A bare failure here says nothing about which half of the OIDC handshake is missing, and
          # the run reads as "the release broke" rather than "one package needs one settings page".
          # ENEEDAUTH means npm found no trusted publisher matching this run; E403 means it found
          # one that names a different owner/repo/workflow.
          if ! npm publish --access public; then
            echo "::error title=Alias not published::npm refused the publish. \`ENEEDAUTH\` or \`403 Forbidden - PUT https://registry.npmjs.org/vitest-auto-spies\` means the trusted publisher for vitest-auto-spies is missing or does not match this run. Fix: npmjs.com -> package vitest-auto-spies -> Settings -> Trusted Publisher -> GitHub Actions, owner ASDAlexey, repository vitest-auto-spy, workflow file auto-release.yml (NOT publish-alias.yml — npm validates the caller of a reusable workflow), environment empty. Then re-run Actions -> Auto Release -> Run workflow with alias_ref set to the tag."
            exit 1
          fi
