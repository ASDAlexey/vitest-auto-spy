name: Mutation testing

# 100 % line and branch coverage says every line of the spy core ran, not that a test would notice
# it breaking. Stryker changes the code one mutant at a time and checks that some test fails; the
# modules it mutates are listed in `stryker.config.mjs`.
#
# Paused because full runs are slow. Remove the job's `if: false` to allow manual runs again.
# Every local release audit runs mutation testing through the audit-kit profile.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    if: false
    name: Mutation testing (spy core)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Node 24 bundles npm 11, the version the lockfile is generated with.
      - run: npm ci --no-audit --no-fund

      # Keyed by commit and restored by prefix: a pull request starts from the newest result on the
      # default branch, and every run saves its own for the next one.
      - name: Restore the incremental result
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Run Stryker
        run: npm run test:mutation

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          retention-days: 30
