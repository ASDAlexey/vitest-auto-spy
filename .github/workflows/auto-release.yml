name: Auto Release

# Runs after CI passes on master (i.e. after a PR is merged and the whole gate is green).
# Determines the version bump from Conventional Commits since the last tag,
# then bumps package.json, tags, publishes to npm and creates a GitHub Release.
#
# Bump rules:
#   - `BREAKING CHANGE` in body, or `type!:` in the header -> major
#   - `feat:`                                              -> minor
#   - `fix:`                                               -> patch
#   - anything else (chore/docs/refactor/ci/test/...)      -> no release
#
# Why `workflow_run` and not `push`: this workflow used to fire on the same push CI did, with
# nothing linking the two. It ran `typecheck`, `test` and `build` — not `test:coverage`,
# `smoke:dist`, `test:node`, `test:bun*`, `test:types`, `export-map:check`, `cold-import:check`,
# lint, or the Angular range job — and published while those were still running, or already red.
# At least six releases went out that way, 5.2.0 and 5.3.0 with the `node:test` lane failing. The
# whole verdict now comes from one place: the CI run for this exact sha has to have concluded
# `success` before anything here starts, and the release path re-runs none of it.
#
# Publishing authenticates with npm Trusted Publishing (OIDC) — no npm token is
# stored in this repository. GitHub Actions mints a short-lived OIDC token from
# the `id-token: write` permission on the `publish` job below and npm exchanges it for a publish
# credential. Provenance is attached automatically (public package, public repo),
# so `--provenance` is not passed.
#
# THIS is the file the npm trusted-publisher config must name: npmjs.com ->
# package `vitest-auto-spy` -> Settings -> Trusted Publisher -> GitHub Actions,
# owner `ASDAlexey`, repository `vitest-auto-spy`, workflow `auto-release.yml`,
# environment left empty. A package can only have one trusted publisher, which is
# why `release.yml` no longer publishes — it only creates the GitHub Release for a
# manually pushed tag. npm validates the workflow *file*, not the job inside it, so splitting the
# work into two jobs below changes nothing about the trusted-publisher configuration.
#
# Two things the OIDC handshake is fragile about:
#   - `actions/setup-node` must NOT be given `registry-url`. It then writes
#     `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc with a
#     placeholder value, npm reads that as "auth is already configured" and skips
#     the token exchange, and the publish dies with E404/ENEEDAUTH. Fixed only in
#     actions/setup-node@v7; v4-v6 all still write the placeholder.
#   - npm must be >= 11.5.1 and Node >= 22.14, hence the pins below.
#
# Why two jobs: `npm ci` runs the install scripts of every dev dependency and their transitive tree,
# and `npm test` runs that code again. None of it has any business being in a process that can mint
# an npm publishing credential — `ACTIONS_ID_TOKEN_REQUEST_URL` and its token are plain environment
# variables in every step of a job that declares `id-token: write`. So `build` installs, builds and
# packs with `contents: read` and nothing else, and hands `publish` a tarball and two patches. The
# privileged job installs nothing: it publishes the tarball npm packed in the other job and uses git
# and `gh`, both preinstalled on the runner.
#
# The `vitest-auto-spies` alias package publishes over OIDC too, from
# publish-alias.yml — but npm validates the *entry point* workflow, not the reusable
# one that runs `npm publish`, so its trusted publisher also names THIS file. That is
# why publish-alias.yml is `workflow_call`-only and the manual "republish the alias"
# path is the `alias_ref` dispatch input below: every publish of either package has to
# enter through auto-release.yml or npm rejects the OIDC token. No `NPM_TOKEN` secret
# is used any more.
#
# The version-bump commit/tag is pushed with GITHUB_TOKEN, which does NOT
# re-trigger workflows, so there is no release loop.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      alias_ref:
        description: >-
          Republish the vitest-auto-spies alias from this commit or tag (e.g. v3.9.0) and do
          nothing else — no bump, no tag, no canonical publish. Leave empty to run the normal
          release path over the default branch.
        type: string
        required: false
        default: ''

# Never run two releases at once.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  # Everything that runs third-party code. No `id-token`, no write access: the worst a compromised
  # dependency can do here is fail the job.
  build:
    # An `alias_ref` dispatch is the alias-only path — skip the whole canonical release. A
    # `workflow_run` start also has to carry a green verdict from a push; a CI run for a pull
    # request never releases anything.
    if: >-
      inputs.alias_ref == ''
      && (github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # read the CI run's conclusion for this sha
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit CI ran on, not the branch tip: a release describes a verdict, and the verdict
          # belongs to one sha.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history + tags for commit analysis

      - name: The commit being released
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Belt and braces for the manual path: a `workflow_dispatch` with no `alias_ref` carries no CI
      # verdict of its own, so the verdict is looked up. On the `workflow_run` path this only
      # confirms what the `if` above already required.
      - name: CI is green for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.base.outputs.sha }}
        run: |
          CONCLUSIONS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '.workflow_runs[].conclusion')"

          if ! printf '%s\n' "$CONCLUSIONS" | grep -qx success; then
            echo "::error::No successful CI run for ${SHA} (${CONCLUSIONS:-none found}). Nothing is published from a commit the gate has not passed."
            exit 1
          fi

          echo "CI passed for ${SHA}."

      # No `registry-url` on purpose — see the header. It would write a placeholder
      # `_authToken` into ~/.npmrc and npm would skip the OIDC exchange. The default
      # registry is registry.npmjs.org anyway, and package.json carries
      # `publishConfig.access: public`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # >= 22.14, the floor for trusted publishing
          cache: npm

      # Exact, not `npm@11`: trusted publishing needs >= 11.5.1 and a floating major
      # must not be able to drift below that floor. 11.19.1 is the last 11.x
      # (2026-08-26); npm 12 is `latest` but is a major this release path has never run.
      - name: Pin npm
        run: npm i -g npm@11.19.1

      - run: npm ci

      - name: Decide version bump from Conventional Commits
        id: bump
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            echo "Analysing commits in ${RANGE}"
          else
            RANGE=""
            echo "No previous tag — analysing full history"
          fi

          SUBJECTS="$(git log $RANGE --format='%s')"
          BODIES="$(git log $RANGE --format='%B')"

          BUMP=""
          # major: "BREAKING CHANGE" in any body, or "type!:" / "type(scope)!:" header
          if echo "$BODIES" | grep -qE 'BREAKING[ -]CHANGE' \
            || echo "$SUBJECTS" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$SUBJECTS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          elif echo "$SUBJECTS" | grep -qE '^fix(\([^)]+\))?:'; then
            BUMP="patch"
          fi

          if [ -z "$BUMP" ]; then
            echo "No releasable commits (feat/fix/BREAKING) since ${LAST_TAG:-start} — skipping release."
            echo "bump=none" >> "$GITHUB_OUTPUT"
          else
            echo "Selected bump: ${BUMP}"
            echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          fi

      # The suite is not re-run here — CI ran all of it on this sha. The build is, because the
      # tarball has to contain a `dist/` somebody watched being produced, and `npm pack` runs no
      # `prepublishOnly`.
      - name: Build the package
        if: steps.bump.outputs.bump != 'none'
        run: npm run build

      # Must run after the build (it measures the fresh dist/) and before the bump. Committing
      # here also means the README published to npm carries the correct number.
      - name: Sync the minzip badge with the fresh build
        if: steps.bump.outputs.bump != 'none'
        run: |
          git config user.name "Alexey Popov"
          git config user.email "asdalexey@yandex.ru"
          npm run size:badge
          if git diff --quiet -- README.md; then
            echo "Badge already matches the built bundle — nothing to commit."
          else
            git commit -m 'chore(readme): sync minzip badge with the built bundle [skip ci]' -- README.md
          fi

      - name: Bump version, commit and tag
        if: steps.bump.outputs.bump != 'none'
        id: version
        run: |
          git config user.name "Alexey Popov"
          git config user.email "asdalexey@yandex.ru"
          # `npm version` updates package.json, creates a commit and a v* tag — locally. Nothing is
          # pushed from this job; the commits travel to the privileged job as patches.
          # [skip ci] is belt-and-suspenders; GITHUB_TOKEN pushes don't trigger workflows anyway.
          #
          # Do NOT capture its stdout. This package defines a `version` lifecycle script, so npm
          # prints that script's banner (`> vitest-auto-spy@x.y.z version`) before the tag name —
          # `$(npm version …)` then yields several lines, and a multi-line `key=value` is rejected
          # by $GITHUB_OUTPUT with `Invalid format '> version'`. That failed the step *after*
          # `git push --follow-tags` had already run, so v1.13.0, v2.0.0 and v2.0.1 were tagged on
          # GitHub while `Publish to npm` and `Create GitHub Release` never ran and npm stayed on
          # 1.12.0. Read the number back from package.json instead, the way the publish step does.
          npm version ${{ steps.bump.outputs.bump }} -m 'chore(release): %s [skip ci]'
          NEW_VERSION="v$(node -p "require('./package.json').version")"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # The tarball is what goes to npm, so it is built here and never rebuilt: the job that
      # publishes it runs no install and no lifecycle script.
      - name: Pack the tarball and the release commits
        if: steps.bump.outputs.bump != 'none'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          npm pack --pack-destination "${RUNNER_TEMP}/release"
          # `git am` on the other side replays these with their messages and authorship intact, so
          # the published history is the one this job composed — no second place computing it.
          git format-patch --binary "${BASE_SHA}..HEAD" -o "${RUNNER_TEMP}/release/patches"
          node -p "JSON.stringify({ version: require('./package.json').version, sha: process.env.BASE_SHA })" \
            > "${RUNNER_TEMP}/release/release.json"
          ls -l "${RUNNER_TEMP}/release" "${RUNNER_TEMP}/release/patches"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.bump.outputs.bump != 'none'
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 7
          if-no-files-found: error

  # The privileged half: it holds the OIDC token and write access to the repository, and it runs no
  # third-party code at all — no `npm ci`, no build, no test.
  publish:
    needs: build
    if: needs.build.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the bump commit/tag and create the GitHub Release
      id-token: write # the OIDC token npm exchanges for a publish credential
    outputs:
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      # No `registry-url`, for the reason in the header.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # >= 22.14, the floor for trusted publishing

      - name: Pin npm
        run: npm i -g npm@11.19.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: ${{ runner.temp }}/release

      # The publish happens before the push (see the step below for why), so between this job's
      # checkout and its push `master` can move — and then npm holds a tarball built from commit A
      # while the tag ends up on top of commit B, with the GitHub Release listing changes the
      # published tarball does not contain. Cheaper to refuse: the next push to master starts a CI
      # run of its own, and that run releases.
      - name: The release branch has not moved since the build
        env:
          BASE_SHA: ${{ needs.build.outputs.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          REMOTE="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"

          if [ "$REMOTE" != "$BASE_SHA" ]; then
            echo "::error::${BRANCH} is at ${REMOTE}, the release was built from ${BASE_SHA}. Refusing to publish a tarball the tag could not describe."
            exit 1
          fi

          echo "${BRANCH} is still at ${BASE_SHA}."

      # Authenticated over OIDC — no NODE_AUTH_TOKEN, and no `--provenance`: npm
      # attaches provenance by itself when it publishes a public package from a
      # public repo through trusted publishing. The tarball is the one packed in the
      # unprivileged job, so publishing runs no lifecycle script of this package either.
      - name: Publish to npm (skip if version already exists)
        env:
          BASE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          VERSION="$(node -p "require('${RUNNER_TEMP}/release/release.json').version")"
          TARBALL="${RUNNER_TEMP}/release/vitest-auto-spy-${VERSION}.tgz"

          if [ ! -f "$TARBALL" ]; then
            echo "::error::${TARBALL} is missing from the build artifact."
            exit 1
          fi

          if npm view "vitest-auto-spy@${VERSION}" version >/dev/null 2>&1; then
            # A retry of a run that published and then failed to push is expected and safe. A
            # version already on npm from a *different* commit is not: it means this run would tag
            # something else with the same number.
            PUBLISHED_SHA="$(npm view "vitest-auto-spy@${VERSION}" gitHead 2>/dev/null || true)"

            if [ -n "$PUBLISHED_SHA" ] && [ "$PUBLISHED_SHA" != "$BASE_SHA" ]; then
              echo "::error::vitest-auto-spy@${VERSION} is on npm from ${PUBLISHED_SHA}, this run is releasing ${BASE_SHA}. Refusing to tag a version whose tarball came from another commit."
              exit 1
            fi

            echo "vitest-auto-spy@${VERSION} is already published — skipping."
          else
            npm publish "$TARBALL" --access public
          fi

      # After the publish, never before it. The commits and the tag exist only in the artifact until
      # this step, so a publish that fails leaves the remote exactly as it was and the next run
      # recomputes the same bump and retries. Pushing first is what produced v1.13.0, v2.0.0, v2.0.1
      # and v3.9.0 — tags on GitHub for versions npm never received. v3.9.0 also showed why that
      # state is hard to leave: the bump is decided over `$(git describe --tags --abbrev=0)..HEAD`,
      # so the pushed tag makes the range empty, every later step skips on `bump != 'none'`, and
      # re-running the failed job publishes nothing. The inverse order can only fail the other way —
      # npm ahead of the tag — which the "already published" guard above makes safe to retry.
      - name: Push the release commit and its tag
        env:
          TAG: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          git config user.name "Alexey Popov"
          git config user.email "asdalexey@yandex.ru"
          git am --3way "${RUNNER_TEMP}"/release/patches/*.patch
          git tag -a "$TAG" -m "chore(release): ${TAG#v} [skip ci]"
          git push --follow-tags origin "HEAD:${BRANCH}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping."
          else
            # Notes come from CHANGELOG.md. `--generate-notes` cannot help here: this repository
            # pushes straight to master, so there are no pull requests for GitHub to list and the
            # generated body is a bare "Full Changelog" link. The script falls back to grouped
            # Conventional Commits when the changelog has no section for this version yet.
            node scripts/release-notes.mjs "$TAG" --out "${RUNNER_TEMP}/release-notes.md"
            gh release create "$TAG" --title "$TAG" --notes-file "${RUNNER_TEMP}/release-notes.md" --latest
          fi

  # The `vitest-auto-spies` alias is a second npm package, generated from this one — see
  # .github/workflows/publish-alias.yml. It goes out after the canonical package is on npm, because
  # it depends on it by an exact caret range.
  #
  # Its own trusted publisher on npmjs.com names *this* file, not publish-alias.yml: npm reads the
  # OIDC token's caller workflow, which for a reusable workflow is the entry point. That is also
  # the reason the manual republish is the `alias_ref` dispatch input on this workflow instead of
  # `Actions -> Publish alias` — a run entered through publish-alias.yml would present a workflow
  # ref npm does not trust. No secrets are passed: the child mints its own OIDC token from the
  # `id-token: write` permission it declares.
  #
  # `always()` because the `publish` job is deliberately skipped on the alias-only dispatch, and a
  # skipped dependency would otherwise skip this job with it.
  #
  # TEMPORARILY OFF on the automatic path (2026-09-03). The npm name `vitest-auto-spies` is held by
  # a tombstone from the earlier unpublish, so no trusted publisher can be registered for it yet and
  # every automatic attempt ends in ENEEDAUTH — turning a green release red for a package that
  # cannot go out. Until npm Support frees the name, the alias only publishes when someone asks for
  # it by hand (Actions -> Auto Release -> Run workflow with `alias_ref`), which is also how to test
  # whether access is back. To restore the automatic publish, put the second clause back:
  #     || (needs.publish.result == 'success' && needs.build.outputs.bump != 'none')
  publish-alias:
    needs: [build, publish]
    if: >-
      always()
      && inputs.alias_ref != ''
    uses: ./.github/workflows/publish-alias.yml
    with:
      ref: ${{ inputs.alias_ref || needs.build.outputs.version }}
