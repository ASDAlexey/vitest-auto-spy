name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - 'scripts/generate-llms-txt.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Per job, never workflow-wide: `pages: write` and `id-token: write` belong to the deploy, and the
# build job runs `bun install` — the install scripts of the docs site's whole dependency tree — so
# it gets the read access it needs and nothing that can publish anything.

# Only one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # `configure-pages` reads the site's settings; enabling it is the deploy job's business
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # needed for lastUpdated timestamps

      # Pinned, not `latest`: the docs are built by whatever `bun-version` resolves to, and a
      # runtime that changes under the site is one more way a deploy goes red without a commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # `setup-bun` caches only the Bun executable, not the packages `bun install` downloads — this
      # is the docs tree's counterpart to the `cache: npm` every Node job in this fleet gets.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-docs-site-${{ hashFiles('docs-site/bun.lock') }}
          restore-keys: bun-docs-site-

      - name: Install dependencies
        run: bun install

      - name: Build VitePress site
        run: bun run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Tell the engines that pull from IndexNow — Yandex, Bing, Seznam, Naver — that the pages changed,
  # instead of waiting for a crawl. Google does not participate; its route is the sitemap submitted
  # in Search Console, which the deploy above refreshes anyway.
  #
  # The key is public by design: ownership is proved by serving it at `keyLocation`, so the file in
  # `docs-site/public/` is the whole authentication. Submission is best-effort — a failure here must
  # never fail a deploy that already succeeded.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Submit every documented URL to IndexNow
        run: |
          KEY=2a4caaf62ad5485f432289e1b2496969
          HOST=asdalexey.github.io
          BASE="https://${HOST}/vitest-auto-spy"

          # The sitemap is the list the site itself publishes — no second inventory to keep in step.
          URLS="$(curl -fsS "${BASE}/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's|</\?loc>||g')"

          if [ -z "$URLS" ]; then
            echo "::warning::sitemap.xml returned no URLs — skipping IndexNow."
            exit 0
          fi

          PAYLOAD="$(jq -n --arg host "$HOST" --arg key "$KEY" --arg keyLocation "${BASE}/${KEY}.txt" \
            --argjson urlList "$(printf '%s\n' "$URLS" | jq -R . | jq -s .)" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"

          echo "Submitting $(printf '%s\n' "$URLS" | wc -l | tr -d ' ') URLs to IndexNow."
          curl -fsS -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD" && echo "IndexNow accepted the submission."
