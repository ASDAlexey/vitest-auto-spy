name: Benchmarks

# The published head-to-head table has to be re-measurable by anyone, and it has to re-measure
# itself — a benchmark nobody re-runs is a claim, not evidence. `workflow_dispatch` is for a
# maintainer re-running it deliberately (the button needs write access, so a visitor forks first);
# the monthly schedule is what keeps the published numbers from silently rotting; the
# `pull_request` trigger is what makes a Dependabot bump of a competitor re-measure against the new
# version, which is the only anti-rot mechanism that survives a single maintainer.
on:
  workflow_dispatch:
  # Not on the hour: GitHub documents that scheduled runs are delayed under load at the top of
  # every hour and that queued jobs may be dropped outright.
  schedule:
    - cron: '17 4 1 * *'
  # The path list covers the harness and the manifests as well as the cases: the Vitest 5 upgrade
  # that broke every `bench*` command touched only `package.json` and the lockfile, and this
  # workflow did not fire. The cheap end-to-end guard that runs on *every* push lives in
  # `bench-smoke.yml`; this one is the ten-minute measurement and keeps its narrow triggers.
  pull_request:
    paths:
      - 'bench/**'
      - 'bench-angular/**'
      - 'vitest.bench.*.mts'
      - 'src/lib/**'
      - 'scripts/bench-*.mjs'
      - 'tsconfig.bench*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bench.yml'

# A superseded commit's measurement is noise: every trigger here serves the newest revision of the
# branch, so cancel the run it replaced instead of queueing ten minutes behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  head-to-head:
    name: Head-to-head vs other libraries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bench/package-lock.json

      # The lockfile is generated with npm 11; pin it — exact, and the same 11.19.1 as
      # auto-release.yml — so `npm ci` interprets the dependency tree the same way and stays in
      # sync.
      - name: Pin npm
        run: npm i -g npm@11.19.1

      - run: npm ci

      # A minute here rather than ten below: if the harness itself is broken, every measurement step
      # after this one is broken too, and this says so with a message about the harness.
      - name: Smoke-test the benchmark harness
        run: npm run bench:smoke

      # The competitors declare `vitest` as a peer, and `bench/.npmrc` is what stops npm installing a
      # second copy of it beside the root one — two copies mean two mock registries, so the bench's
      # prune reaches only one of them and the run dies on an out-of-memory heap.
      - name: Install competitor packages
        working-directory: bench
        run: npm ci

      # The benchmarks are TypeScript and they drift. `npm run check` cannot cover them, because
      # they import the competitor packages installed in the step above, so this is the only place
      # that type-checks them.
      - name: Type-check the benchmarks
        run: npm run typecheck:bench

      # One job, one machine, every arm back-to-back. Splitting the arms across matrix jobs would
      # compare two different runners and report the difference as a library difference.
      #
      # `--precise` — seven whole passes at double iteration count — for the same reason the
      # Angular arm below repeats five times: a single pass of the head-to-head flaps by 20-30 %,
      # and this table is the published one. `bench:vs` prints the rendered table itself and
      # leaves one results file per pass; the next step re-renders them merged into the summary.
      - name: Run benchmarks
        run: npm run bench:vs:precise

      - name: Publish table to the job summary
        run: node scripts/bench-report.mjs bench-results.*.json >> "$GITHUB_STEP_SUMMARY"

      # The table above gates nothing, and an absolute threshold on a shared runner cannot gate it:
      # p75 here swings tens of percent between runs of identical code. `bench:check` compares each
      # arm against a reference arm measured in the same run, which cancels the machine out. The
      # committed baseline covers the self-comparison cases, so this needs its own measurement pass —
      # it is the cheap one, and it needs no competitor install.
      - name: Run the self-comparison benchmark
        run: npm run bench -- --json bench-results.self.json --no-memory

      # Report-only on purpose: the first runs are calibrating the baseline rather than catching
      # regressions, and this must not turn the workflow red until those ratios have settled. Add
      # `--strict` once they have.
      - name: Compare against the committed baseline
        run: npm run bench:check -- bench-results.self.json >> "$GITHUB_STEP_SUMMARY"

      - name: Type-check the Angular benchmark
        run: npm run typecheck:bench-angular

      # Five passes, not one: a single pass of this benchmark flaps by 20-30 % and produces false
      # failures. Report-only, like the self-comparison gate above.
      - name: Run the Angular render benchmark
        run: npm run bench:angular -- --repeat 5 --json bench-results.angular.json

      - name: Compare against the Angular baseline
        run: npm run bench:check -- bench-results.angular.json --baseline bench-angular/baseline.json >> "$GITHUB_STEP_SUMMARY"

      # `always()`: a mid-run failure still leaves the passes that did complete, and those
      # measurements are exactly the evidence the failure needs.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-results
          path: bench-results.*.json
          retention-days: 90
