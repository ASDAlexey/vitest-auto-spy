version: 2

updates:
  # Dependency updates are prepared manually by the maintainer before a release.
  # Keep the ecosystem configuration available, but do not open version-update PRs.
  - package-ecosystem: npm
    directory: /bench
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore

  # Every `uses:` is pinned to a commit sha, which is the only pin a mutable tag cannot be moved
  # under. Update both the sha and its version comment when preparing a release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
