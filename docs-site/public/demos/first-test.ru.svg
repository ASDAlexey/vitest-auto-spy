<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title description" aria-label="От класса до зелёного теста. Создаём типизированный спай, задаём ответ и проверяем вызов." xml:lang="ru">
<title id="title">От класса до зелёного теста</title>
<desc id="description">Создаём типизированный спай, задаём ответ и проверяем вызов. UserService вернул Ada</desc>
