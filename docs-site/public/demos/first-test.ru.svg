<g class=""><text x="79" y="220" text-anchor="end" class="lineno">1</text><text x="98" y="220" class="code" xml:space="preserve"><tspan class="kw">import</tspan> { createSpyFromClass } <tspan class="kw">from</tspan> <tspan class="str">'vitest-auto-spy'</tspan>;</text></g>
<g class=""><text x="79" y="248" text-anchor="end" class="lineno">3</text><text x="98" y="248" class="code" xml:space="preserve"><tspan class="fn">it</tspan>(<tspan class="str">'loads a user'</tspan>, <tspan class="kw">async</tspan> () =&gt; {</text></g>
<g class="reveal0"><text x="79" y="274" text-anchor="end" class="lineno">4</text><text x="98" y="274" class="code" xml:space="preserve">  <tspan class="kw">const</tspan> api = <tspan class="fn">createSpyFromClass</tspan>(ApiService);</text></g>
<g class="reveal1"><text x="79" y="304" text-anchor="end" class="lineno">5</text><text x="98" y="304" class="code" xml:space="preserve">  api.<tspan class="fn">get.resolveWith</tspan>({ id: 1, name: <tspan class="str">'Ada'</tspan> });</text></g>
<g class="reveal2"><text x="79" y="339" text-anchor="end" class="lineno">7</text><text x="98" y="339" class="code" xml:space="preserve">  <tspan class="kw">const</tspan> user = <tspan class="kw">await new</tspan> UserService(api).load(1);</text></g>
<g class="assertion"><text x="79" y="372" text-anchor="end" class="lineno">9</text><text x="98" y="372" class="code" xml:space="preserve">  expect(user.name).toBe(<tspan class="str">'Ada'</tspan>);</text></g>
<g class="assertion"><text x="79" y="398" text-anchor="end" class="lineno">10</text><text x="98" y="398" class="code" xml:space="preserve">  expect(api.get).toHaveBeenCalledWith(<tspan class="str">'/users/1'</tspan>);</text></g>
<g class=""><text x="79" y="414" text-anchor="end" class="lineno">11</text><text x="98" y="414" class="code" xml:space="preserve">});</text></g>
