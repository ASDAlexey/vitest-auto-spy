  </g>
  <g class="spy">
      <text x="66" y="356" class="line-number">6</text><text x="84" y="356" class="code" xml:space="preserve">  <tspan class="keyword">const</tspan> users = <tspan class="fn">injectSpy</tspan>(UserService);</text>
      <text x="66" y="379" class="line-number">7</text><text x="84" y="379" class="code" xml:space="preserve">  users.load.<tspan class="fn">mockReturnValue</tspan>(of({ id: 1, name: <tspan class="string">'Ada'</tspan> }));</text>
      <text x="66" y="402" class="line-number">8</text>
  </g>
  <g class="act">
      <text x="66" y="425" class="line-number">9</text><text x="84" y="425" class="code" xml:space="preserve">  <tspan class="keyword">const</tspan> fixture = TestBed.createComponent(ProfileComponent);</text>
      <text x="66" y="448" class="line-number">10</text><text x="84" y="448" class="code" xml:space="preserve">  <tspan class="keyword">await</tspan> <tspan class="fn">stable</tspan>(fixture);</text>
      <text x="66" y="471" class="line-number">11</text>
  </g>
  <g class="checks">
      <text x="66" y="494" class="line-number">12</text><text x="84" y="494" class="code" xml:space="preserve">  <tspan class="fn">expect</tspan>(fixture.nativeElement.textContent).toContain(<tspan class="string">'Ada'</tspan>);</text>
      <text x="66" y="517" class="line-number">13</text><text x="84" y="517" class="code" xml:space="preserve">  <tspan class="fn">expect</tspan>(users.load).toHaveBeenCalledTimes(1);</text>
