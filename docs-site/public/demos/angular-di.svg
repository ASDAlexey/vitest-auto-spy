<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" lang="en" xml:lang="en" role="img" aria-labelledby="demo-title" aria-describedby="demo-description" aria-label="An animated editor and a diagram of Angular dependency injection. provideAutoSpy registers a spy for UserService in TestBed. injectSpy returns the typed spy so the test can make load return Ada. The test renders ProfileComponent, checks that it shows Ada, and verifies that it called load once. The final frame shows both checks passing.">
  <title id="demo-title">Angular TestBed: test with a typed spy</title>
  <desc id="demo-description">An animated editor and a diagram of Angular dependency injection. provideAutoSpy registers a spy for UserService in TestBed. injectSpy returns the typed spy so the test can make load return Ada. The test renders ProfileComponent, checks that it shows Ada, and verifies that it called load once. The final frame shows both checks passing.</desc>
