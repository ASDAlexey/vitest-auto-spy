    <radialGradient id="aura"><stop stop-color="#4cc9f0" stop-opacity=".18"/><stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/></radialGradient>
    <radialGradient id="aura-green"><stop stop-color="#7ee787" stop-opacity=".11"/><stop offset="1" stop-color="#7ee787" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#81a7cb" opacity=".15"/></pattern>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="143%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#030712" flood-opacity=".55"/></filter>
