      <text x="66" y="241" class="line-number">1</text><text x="84" y="241" class="code" xml:space="preserve">it(<tspan class="string">'shows the user name'</tspan>, <tspan class="keyword">async</tspan> () =&gt; {</text>
  <g class="provider">
      <text x="66" y="264" class="line-number">2</text><text x="84" y="264" class="code" xml:space="preserve">  TestBed.configureTestingModule({</text>
      <text x="66" y="287" class="line-number">3</text><text x="84" y="287" class="code" xml:space="preserve">    imports: [ProfileComponent],</text>
      <text x="66" y="310" class="line-number">4</text><text x="84" y="310" class="code" xml:space="preserve">    providers: [<tspan class="fn">provideAutoSpy</tspan>(UserService)],</text>
