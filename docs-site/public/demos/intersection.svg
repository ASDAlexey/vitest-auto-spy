    <text x="59" y="300" fill="#89999f">05</text>
    <text x="101" y="300" xml:space="preserve"><tspan fill="#beb3fa">const</tspan><tspan fill="#e1eaed"> fixture = TestBed.createComponent(RevealHost);</tspan></text>
    <text x="59" y="324" fill="#89999f">06</text>
    <text x="101" y="324" xml:space="preserve"><tspan fill="#e1eaed">fixture.detectChanges();</tspan></text>
