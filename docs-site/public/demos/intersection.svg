<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title description" aria-label="Reveal a card without scrolling. The test installs stubIntersectionObserver, emits an intersection entry with true, waits for Angular to update, and checks that the card has the is-visible class. The viewport never scrolls.">
  <title id="title">Reveal a card without scrolling</title>
  <desc id="description">The test installs stubIntersectionObserver, emits an intersection entry with true, waits for Angular to update, and checks that the card has the is-visible class. The viewport never scrolls.</desc>
